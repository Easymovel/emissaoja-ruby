name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04 # Rubies prontos do setup-ruby; a gem declara Ruby >= 3.0
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.0", "3.1", "3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Testes (sem rede; a integração com o sandbox é pulada sem EMISSAOJA_TEST_KEY)
        run: bundle exec rake test
      - name: Construir a gem
        run: gem build emissaoja.gemspec
